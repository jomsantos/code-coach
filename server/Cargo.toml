[package]
name = "code-coach-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
